# Opcional para os integrantes que ainda nao tem SQL Server.
# Exige Docker Desktop com integracao WSL ou Docker Engine no Linux.
# Senha passada pela variavel BYTETECH_DB_PASSWORD no script iniciar.sh.
name: bytetech-pim
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${BYTETECH_DB_PASSWORD:?Defina BYTETECH_DB_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - banco_bytetech:/var/opt/mssql
    restart: unless-stopped
volumes:
  banco_bytetech:
